<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OT512 Proxy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 380px;
            min-height: 500px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            overflow: hidden;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: #16213e;
            border-bottom: 1px solid #333;
        }

        .header h1 {
            font-size: 16px;
            color: #fff;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #9E9E9E;
        }

        .status-dot.active {
            background: #4CAF50;
            box-shadow: 0 0 6px #4CAF50;
        }

        .tabs {
            display: flex;
            background: #16213e;
            border-bottom: 1px solid #333;
        }

        .tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            font-size: 13px;
            cursor: pointer;
            color: #888;
            border-bottom: 2px solid transparent;
            transition: 0.2s;
        }

        .tab:hover {
            color: #fff;
        }

        .tab.active {
            color: #4CAF50;
            border-bottom-color: #4CAF50;
        }

        .content {
            padding: 12px;
        }

        .panel {
            display: none;
        }

        .panel.active {
            display: block;
        }

        .toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            background: #16213e;
            border-radius: 6px;
            margin-bottom: 12px;
        }

        .toggle-label {
            font-size: 13px;
        }

        .toggle {
            position: relative;
            width: 44px;
            height: 24px;
        }

        .toggle input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background-color: #444;
            transition: 0.3s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.3s;
            border-radius: 50%;
        }

        input:checked+.slider {
            background-color: #4CAF50;
        }

        input:checked+.slider:before {
            transform: translateX(20px);
        }

        .section {
            background: #16213e;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 12px;
        }

        .section-title {
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .server-list {
            max-height: 200px;
            overflow-y: auto;
        }

        .server-item {
            display: flex;
            align-items: center;
            padding: 8px 10px;
            background: #0f0f23;
            border-radius: 4px;
            margin-bottom: 6px;
            cursor: pointer;
            transition: 0.2s;
        }

        .server-item:hover {
            background: #1a1a3e;
        }

        .server-item.active {
            border: 1px solid #4CAF50;
        }

        .server-item .radio {
            width: 14px;
            height: 14px;
            border: 2px solid #666;
            border-radius: 50%;
            margin-right: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .server-item.active .radio {
            border-color: #4CAF50;
        }

        .server-item.active .radio::after {
            content: '';
            width: 8px;
            height: 8px;
            background: #4CAF50;
            border-radius: 50%;
        }

        .server-info {
            flex: 1;
            min-width: 0;
        }

        .server-name {
            font-size: 13px;
            font-weight: 500;
        }

        .server-detail {
            font-size: 11px;
            color: #888;
            margin-top: 2px;
        }

        .server-actions {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }

        .btn-icon {
            width: 24px;
            height: 24px;
            border: none;
            background: transparent;
            color: #888;
            cursor: pointer;
            border-radius: 4px;
            font-size: 12px;
        }

        .btn-icon:hover {
            background: #333;
            color: #fff;
        }

        .btn-icon.delete:hover {
            color: #f44336;
        }

        .btn-icon.test:hover {
            color: #4CAF50;
        }

        /* 测试进度条 */
        .test-progress {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 2px;
            background: #4CAF50;
            transition: width 0.3s ease;
            width: 0;
            border-radius: 0 0 4px 4px;
        }

        .server-item.testing {
            position: relative;
        }

        .server-item.testing .test-progress {
            animation: test-progress 2s ease-in-out;
        }

        @keyframes test-progress {
            0% {
                width: 0;
            }

            50% {
                width: 70%;
            }

            100% {
                width: 100%;
            }
        }

        .server-item.test-success {
            border-color: #4CAF50 !important;
        }

        .server-item.test-fail {
            border-color: #f44336 !important;
        }

        .test-result {
            font-size: 10px;
            margin-left: 8px;
            padding: 2px 6px;
            border-radius: 3px;
        }

        .test-result.success {
            background: rgba(76, 175, 80, 0.2);
            color: #4CAF50;
        }

        .test-result.fail {
            background: rgba(244, 67, 54, 0.2);
            color: #f44336;
        }

        .btn {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 8px;
        }

        .btn-primary {
            background: #4CAF50;
            color: white;
        }

        .btn-primary:hover {
            background: #45a049;
        }

        .btn-secondary {
            background: #333;
            color: #fff;
        }

        .btn-secondary:hover {
            background: #444;
        }

        .form-group {
            margin-bottom: 10px;
        }

        .form-group label {
            display: block;
            font-size: 11px;
            color: #888;
            margin-bottom: 4px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #333;
            border-radius: 4px;
            background: #0f0f23;
            color: #fff;
            font-size: 13px;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #4CAF50;
        }

        .form-row {
            display: flex;
            gap: 8px;
        }

        .form-row .form-group {
            flex: 1;
        }

        .form-row .form-group.small {
            flex: 0 0 80px;
        }

        .mode-options {
            display: flex;
            gap: 8px;
        }

        .mode-option {
            flex: 1;
            padding: 10px;
            text-align: center;
            background: #0f0f23;
            border: 1px solid #333;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: 0.2s;
        }

        .mode-option:hover {
            border-color: #555;
        }

        .mode-option.active {
            border-color: #4CAF50;
            background: rgba(76, 175, 80, 0.1);
        }

        .mode-option .mode-title {
            font-weight: 500;
            margin-bottom: 4px;
        }

        .mode-option .mode-desc {
            font-size: 10px;
            color: #888;
        }

        .rules-info {
            padding: 10px;
            background: #0f0f23;
            border-radius: 4px;
            margin-bottom: 10px;
        }

        .rules-info .count {
            font-size: 18px;
            font-weight: bold;
            color: #4CAF50;
        }

        .rules-info .label {
            font-size: 11px;
            color: #888;
        }

        .rules-url {
            font-size: 11px;
            color: #666;
            margin-top: 6px;
            word-break: break-all;
        }

        .rule-source {
            display: flex;
            align-items: center;
            padding: 8px 10px;
            background: #0f0f23;
            border-radius: 4px;
            margin-bottom: 6px;
        }

        .rule-source .toggle-small {
            position: relative;
            width: 36px;
            height: 20px;
            margin-right: 10px;
            flex-shrink: 0;
        }

        .rule-source .toggle-small input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .rule-source .toggle-small .slider-small {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background-color: #444;
            transition: 0.3s;
            border-radius: 20px;
        }

        .rule-source .toggle-small .slider-small:before {
            position: absolute;
            content: "";
            height: 14px;
            width: 14px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.3s;
            border-radius: 50%;
        }

        .rule-source .toggle-small input:checked+.slider-small {
            background-color: #4CAF50;
        }

        .rule-source .toggle-small input:checked+.slider-small:before {
            transform: translateX(16px);
        }

        .rule-source .source-info {
            flex: 1;
            min-width: 0;
        }

        .rule-source .source-name {
            font-size: 13px;
            font-weight: 500;
        }

        .rule-source .source-desc {
            font-size: 11px;
            color: #888;
        }

        .rule-source .btn-icon {
            width: 28px;
            height: 28px;
        }

        .import-section {
            margin-top: 12px;
        }

        .import-url {
            display: flex;
            gap: 8px;
        }

        .import-url input {
            flex: 1;
        }

        .import-url button {
            padding: 8px 12px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .import-url button:hover {
            background: #45a049;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: #1a1a2e;
            border-radius: 8px;
            padding: 16px;
            width: 340px;
            max-height: 90%;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #444 #1a1a2e;
        }

        .modal-content::-webkit-scrollbar {
            width: 6px;
        }

        .modal-content::-webkit-scrollbar-track {
            background: #1a1a2e;
        }

        .modal-content::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 3px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .modal-header h2 {
            font-size: 16px;
        }

        .modal-close {
            background: none;
            border: none;
            color: #888;
            font-size: 20px;
            cursor: pointer;
        }

        .modal-close:hover {
            color: #fff;
        }

        .footer {
            text-align: center;
            font-size: 10px;
            color: #555;
            padding: 8px;
            border-top: 1px solid #333;
            margin-top: 12px;
        }

        /* Custom Toast Notification */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: #fff;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 12px;
            z-index: 200;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
        }

        .toast.success {
            background: #4CAF50;
        }

        .toast.error {
            background: #f44336;
        }

        /* Custom Confirm Dialog */
        .confirm-dialog {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 150;
            align-items: center;
            justify-content: center;
        }

        .confirm-dialog.show {
            display: flex;
        }

        .confirm-content {
            background: #1a1a2e;
            border-radius: 8px;
            padding: 16px;
            width: 280px;
            text-align: center;
        }

        .confirm-content p {
            margin-bottom: 16px;
            font-size: 13px;
        }

        .confirm-buttons {
            display: flex;
            gap: 8px;
        }

        .confirm-buttons button {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .confirm-buttons .btn-cancel {
            background: #333;
            color: #fff;
        }

        .confirm-buttons .btn-ok {
            background: #4CAF50;
            color: #fff;
        }
    </style>
</head>

<body>
    <!-- Loading overlay -->
    <div id="loadingOverlay"
        style="position:fixed;inset:0;background:#1a1a2e;display:flex;align-items:center;justify-content:center;z-index:9999;">
        <div style="text-align:center;color:#888;">
            <div style="font-size:24px;margin-bottom:8px;">⏳</div>
            <div style="font-size:12px;">加载中...</div>
        </div>
    </div>

    <div class="header">
        <h1>
            <img src="icons/icon48.png" style="width:24px;height:24px;vertical-align:middle;margin-right:8px;">OT512
            Proxy
        </h1>
        <div class="status">
            <label class="toggle" style="transform: scale(0.85);">
                <input type="checkbox" id="enableToggleHeader">
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <div class="tabs">
        <div class="tab active" data-tab="proxy">代理模式</div>
        <div class="tab" data-tab="servers">服务器</div>
        <div class="tab" data-tab="rules">规则</div>
    </div>

    <div class="content">
        <!-- 代理面板 -->
        <div class="panel active" id="proxyPanel">
            <div class="section">
                <div class="section-title">代理模式</div>
                <div class="mode-options">
                    <div class="mode-option active" data-mode="all">
                        <div class="mode-title">全局</div>
                        <div class="mode-desc">所有流量走代理</div>
                    </div>
                    <div class="mode-option" data-mode="rules">
                        <div class="mode-title">智能</div>
                        <div class="mode-desc">规则分流</div>
                    </div>
                    <div class="mode-option" data-mode="bypass">
                        <div class="mode-title">直连</div>
                        <div class="mode-desc">仅本地直连</div>
                    </div>
                </div>
            </div>

            <div class="section">
                <div class="section-title">当前服务器</div>
                <div id="currentServer">
                    <div style="text-align:center;color:#666;padding:10px;font-size:12px;">暂无服务器，请添加</div>
                </div>
            </div>
        </div>

        <!-- 服务器面板 -->
        <div class="panel" id="serversPanel">
            <div class="section">
                <div class="section-title">服务器列表</div>
                <div class="server-list" id="serverList"></div>
                <button class="btn btn-secondary" id="addServerBtn">+ 添加服务器</button>
            </div>
        </div>

        <!-- 规则面板 -->
        <div class="panel" id="rulesPanel">
            <div class="section">
                <div class="section-title">规则状态</div>
                <div class="rules-info">
                    <div class="count" id="rulesCount">0</div>
                    <div class="label">条规则</div>
                    <div class="rules-url" id="lastUpdate">未导入规则</div>
                </div>
            </div>

            <div class="section">
                <div class="section-title">规则源</div>
                <div id="ruleSourcesList">
                    <!-- 规则源列表 -->
                </div>
                <button class="btn btn-secondary" id="addRuleSourceBtn" style="margin-top: 8px;">+ 添加规则源</button>
            </div>

            <button class="btn btn-secondary" id="clearRulesBtn">清除所有规则</button>
        </div>
    </div>

    <!-- 添加服务器弹窗 -->
    <div class="modal" id="serverModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">添加服务器</h2>
                <button class="modal-close" id="closeModal">&times;</button>
            </div>
            <div class="form-group">
                <label>服务器名称</label>
                <input type="text" id="serverName" placeholder="如：Tencent JP">
            </div>
            <div class="form-row">
                <div class="form-group" style="flex: 0 0 90px;">
                    <label>协议</label>
                    <select id="serverType">
                        <option value="http">HTTP</option>
                        <option value="https" selected>HTTPS</option>
                        <option value="socks5">SOCKS5</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>服务器地址</label>
                    <input type="text" id="serverHost" placeholder="IP或域名">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>用户名（可选）</label>
                    <input type="text" id="serverUsername" placeholder="用户名">
                </div>
                <div class="form-group">
                    <label>密码（可选）</label>
                    <input type="password" id="serverPassword" placeholder="密码">
                </div>
            </div>
            <button class="btn btn-primary" id="saveServerBtn">保存</button>
        </div>
    </div>

    <!-- 添加/编辑规则源弹窗 -->
    <div class="modal" id="ruleSourceModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="ruleSourceModalTitle">添加规则源</h2>
                <button class="modal-close" id="closeRuleSourceModal">&times;</button>
            </div>
            <div class="form-row">
                <div class="form-group" style="flex: 1;">
                    <label>规则源名称</label>
                    <input type="text" id="ruleSourceName" placeholder="如：GFWList">
                </div>
                <div class="form-group" style="flex: 0 0 110px;">
                    <label>规则类型</label>
                    <select id="ruleSourceType">
                        <option value="proxy">执行代理</option>
                        <option value="direct">执行直连</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label>规则文件URL</label>
                <input type="text" id="ruleSourceUrl" placeholder="https://example.com/rules.txt">
            </div>
            <div class="form-group">
                <label>或直接粘贴规则内容</label>
                <textarea id="ruleSourceContent"
                    style="width: 100%; height: 100px; padding: 8px; border: 1px solid #333; border-radius: 4px; background: #0f0f23; color: #fff; font-size: 11px; resize: vertical;"
                    placeholder="粘贴规则内容（支持Base64编码）"></textarea>
            </div>
            <div class="form-group">
                <label>描述（可选）</label>
                <input type="text" id="ruleSourceDesc" placeholder="规则说明">
            </div>
            <div class="form-group">
                <label id="importStatus" style="color: #888; font-size: 12px;"></label>
            </div>
            <div class="form-row" style="margin-top: 12px;">
                <button class="btn btn-secondary" id="importRuleSourceBtn"
                    style="width: auto; flex: 1; margin-top: 0;">导入</button>
                <button class="btn btn-primary" id="saveRuleSourceBtn"
                    style="width: auto; flex: 1; margin-top: 0;">保存</button>
            </div>
        </div>
    </div>

    <div class="footer" id="footer">
        <span id="versionInfo">OT512 Proxy v1.0.0</span>
        <span id="updateNotice" style="display: none; color: #4CAF50; cursor: pointer; margin-left: 8px;"
            title="点击下载新版本">🔄 有新版本</span>
    </div>

    <script src="popup.js"></script>
</body>

</html>
