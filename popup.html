<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OT512 Proxy</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <!-- Loading overlay -->
    <div id="loadingOverlay"
        style="position:fixed;inset:0;background:#1a1a2e;display:flex;align-items:center;justify-content:center;z-index:9999;">
        <div style="text-align:center;color:#888;">
            <div style="font-size:24px;margin-bottom:8px;">⏳</div>
            <div style="font-size:12px;">加载中...</div>
        </div>
    </div>

    <div class="header">
        <h1>
            <img src="icons/icon48.png" style="width:24px;height:24px;vertical-align:middle;margin-right:8px;">OT512 Proxy
        </h1>
        <div class="status">
            <label class="toggle" style="transform: scale(0.85);">
                <input type="checkbox" id="enableToggleHeader">
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <div class="tabs">
        <div class="tab active" data-tab="proxy">代理模式</div>
        <div class="tab" data-tab="servers">服务器</div>
        <div class="tab" data-tab="rules">规则</div>
    </div>

    <div class="content">
        <!-- 代理面板 -->
        <div class="panel active" id="proxyPanel">
            <div class="section">
                <div class="section-title">代理模式</div>
                <div class="mode-options">
                    <div class="mode-option active" data-mode="all">
                        <div class="mode-title">全局</div>
                        <div class="mode-desc">所有流量走代理</div>
                    </div>
                    <div class="mode-option" data-mode="rules">
                        <div class="mode-title">智能</div>
                        <div class="mode-desc">规则分流</div>
                    </div>
                    <div class="mode-option" data-mode="bypass">
                        <div class="mode-title">直连</div>
                        <div class="mode-desc">仅本地直连</div>
                    </div>
                </div>
            </div>

            <div class="section">
                <div class="section-title">当前服务器</div>
                <div id="currentServer">
                    <div style="text-align:center;color:#666;padding:10px;font-size:12px;">暂无服务器，请添加</div>
                </div>
            </div>
        </div>

        <!-- 服务器面板 -->
        <div class="panel" id="serversPanel">
            <div class="section">
                <div class="section-title">服务器列表</div>
                <div class="server-list" id="serverList"></div>
                <button class="btn btn-secondary" id="addServerBtn">+ 添加服务器</button>
            </div>
        </div>

        <!-- 规则面板 -->
        <div class="panel" id="rulesPanel">
            <div class="section">
                <div class="section-title">规则状态</div>
                <div class="rules-info">
                    <div class="count" id="rulesCount">0</div>
                    <div class="label">条规则</div>
                    <div class="rules-url" id="lastUpdate">未导入规则</div>
                </div>
            </div>

            <div class="section">
                <div class="section-title">规则源</div>
                <div id="ruleSourcesList"></div>
                <button class="btn btn-secondary" id="addRuleSourceBtn" style="margin-top: 8px;">+ 添加规则源</button>
            </div>

            <button class="btn btn-secondary" id="clearRulesBtn">清除所有规则</button>
        </div>
    </div>

    <div class="footer" id="footer">
        <span id="versionInfo">OT512 Proxy v1.0.0</span>
        <span id="updateNotice" style="display:none;color:#4CAF50;cursor:pointer;margin-left:8px;" title="点击下载新版本">🔄 有新版本</span>
    </div>

    <!-- 添加服务器弹窗 -->
    <div class="modal" id="serverModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">添加服务器</h2>
                <button class="modal-close" id="closeModal">&times;</button>
            </div>
            <div class="form-group">
                <label>服务器名称</label>
                <input type="text" id="serverName" placeholder="如：Tencent JP">
            </div>
            <div class="form-row">
                <div class="form-group" style="flex: 0 0 90px;">
                    <label>协议</label>
                    <select id="serverType">
                        <option value="http">HTTP</option>
                        <option value="https" selected>HTTPS</option>
                        <option value="socks5">SOCKS5</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>服务器地址</label>
                    <input type="text" id="serverHost" placeholder="IP或域名">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>用户名（可选）</label>
                    <input type="text" id="serverUsername" placeholder="用户名">
                </div>
                <div class="form-group">
                    <label>密码（可选）</label>
                    <input type="password" id="serverPassword" placeholder="密码">
                </div>
            </div>
            <button class="btn btn-primary" id="saveServerBtn">保存</button>
        </div>
    </div>

    <!-- 添加/编辑规则源弹窗 -->
    <div class="modal" id="ruleSourceModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="ruleSourceModalTitle">添加规则源</h2>
                <button class="modal-close" id="closeRuleSourceModal">&times;</button>
            </div>
            <div class="form-row">
                <div class="form-group" style="flex: 1;">
                    <label>规则源名称</label>
                    <input type="text" id="ruleSourceName" placeholder="如：GFWList">
                </div>
                <div class="form-group" style="flex: 0 0 110px;">
                    <label>规则类型</label>
                    <select id="ruleSourceType">
                        <option value="proxy">执行代理</option>
                        <option value="direct">执行直连</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label>规则文件URL</label>
                <input type="text" id="ruleSourceUrl" placeholder="https://example.com/rules.txt">
            </div>
            <div class="form-group">
                <label>或直接粘贴规则内容</label>
                <textarea id="ruleSourceContent"
                    style="width:100%;height:100px;padding:8px;border:1px solid #333;border-radius:4px;background:#0f0f23;color:#fff;font-size:11px;resize:vertical;"
                    placeholder="粘贴规则内容（支持Base64编码）"></textarea>
            </div>
            <div class="form-group">
                <label>描述（可选）</label>
                <input type="text" id="ruleSourceDesc" placeholder="规则说明">
            </div>
            <div class="form-group">
                <label id="importStatus" style="color:#888;font-size:12px;"></label>
            </div>
            <div class="form-row" style="margin-top:12px;">
                <button class="btn btn-secondary" id="importRuleSourceBtn" style="width:auto;flex:1;margin-top:0;">导入</button>
                <button class="btn btn-primary" id="saveRuleSourceBtn" style="width:auto;flex:1;margin-top:0;">保存</button>
            </div>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
